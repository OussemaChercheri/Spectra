name: Automated Tests by Oussema Chercheri

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test
      env:
        CI: true

    - name: Notify Oussema Chercheri
      if: ${{ success() }}
      run: echo "Tests passed successfully, Oussema Chercheri!"
